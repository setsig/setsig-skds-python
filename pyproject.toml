[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "setsig"
version = "0.8.0"
description = "Official Python SDK for setsig.com — Physical Presence & Verification Infrastructure-as-a-Service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "setsig Developer Relations", email = "dev@setsig.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.urls]
Homepage = "https://setsig.com"
Documentation = "https://setsig.com/docs"
Repository = "https://github.com/setsig/setsig-python"

[tool.setuptools.packages.find]
where = ["src"]

